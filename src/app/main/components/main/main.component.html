<mat-toolbar color="accent">
  <!-- Optional toggle button for small screens -->
  <button
    mat-icon-button
    class="menu-icon"
    (click)="toggleSidenav()"
    *ngIf="isSmallScreen"
  >
    <mat-icon>menu</mat-icon>
  </button>

  <!-- Horizontal Navigation Links -->
  <span class="nav-links">
    <a mat-button routerLink="/home">Home</a>
    <a mat-button routerLink="/gallery">Gallery</a>
    <a mat-button routerLink="/about">About</a>
    <!-- Uncomment if needed -->
    <!-- <a mat-button routerLink="/contact">Contact Us</a> -->
  </span>
</mat-toolbar>

<!-- Main Content Area -->
<div class="content">
  <ng-content></ng-content>
</div>
