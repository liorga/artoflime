<div class="gallery-container">
  <!-- Gallery View Toggle -->
  <div class="gallery-header">
    <h2 class="gallery-title">Our Lime Pointing Projects</h2>
    <div class="view-toggle">
      <button
        [class.active]="viewMode === 'carousel'"
        (click)="setViewMode('carousel')"
        class="toggle-btn"
      >
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <rect
            x="3"
            y="3"
            width="18"
            height="18"
            rx="2"
            stroke="currentColor"
            stroke-width="2"
          />
          <path d="M9 12l2 2 4-4" stroke="currentColor" stroke-width="2" />
        </svg>
        Single View
      </button>
      <button
        [class.active]="viewMode === 'grid'"
        (click)="setViewMode('grid')"
        class="toggle-btn"
      >
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <rect
            x="3"
            y="3"
            width="7"
            height="7"
            stroke="currentColor"
            stroke-width="2"
          />
          <rect
            x="14"
            y="3"
            width="7"
            height="7"
            stroke="currentColor"
            stroke-width="2"
          />
          <rect
            x="3"
            y="14"
            width="7"
            height="7"
            stroke="currentColor"
            stroke-width="2"
          />
          <rect
            x="14"
            y="14"
            width="7"
            height="7"
            stroke="currentColor"
            stroke-width="2"
          />
        </svg>
        Grid View
      </button>
    </div>
  </div>

  <!-- Carousel View (Default) -->
  <div class="carousel-view" *ngIf="viewMode === 'carousel'">
    <div class="carousel-container">
      <div class="main-image">
        <img
          [src]="filteredImages[currentImageIndex].src"
          [alt]="filteredImages[currentImageIndex].alt"
          (click)="openLightbox(filteredImages[currentImageIndex])"
          class="featured-image"
        />

        <!-- Image Info Overlay -->
        <div class="image-info-overlay">
          <h3>{{ filteredImages[currentImageIndex].title }}</h3>
        </div>

        <!-- Navigation Arrows -->
        <button
          class="carousel-nav prev"
          (click)="previousCarouselImage()"
          [disabled]="filteredImages.length <= 1"
          aria-label="Previous image"
        >
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
            <path
              d="M15 18L9 12L15 6"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </button>

        <button
          class="carousel-nav next"
          (click)="nextCarouselImage()"
          [disabled]="filteredImages.length <= 1"
          aria-label="Next image"
        >
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
            <path
              d="M9 18L15 12L9 6"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </button>
      </div>

      <!-- Image Counter -->
      <div class="image-counter">
        {{ currentImageIndex + 1 }} / {{ filteredImages.length }}
      </div>

      <!-- Thumbnail Strip -->
      <div class="thumbnail-strip">
        <div class="thumbnails">
          <button
            *ngFor="let image of filteredImages; let i = index"
            [class.active]="i === currentImageIndex"
            (click)="setCurrentImage(i)"
            class="thumbnail"
          >
            <img [src]="image.src" [alt]="image.alt" />
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Grid View -->
  <div class="grid-view" *ngIf="viewMode === 'grid'">
    <!-- Gallery Grid -->
    <div class="gallery-grid">
      <div
        *ngFor="let image of filteredImages; let i = index"
        class="gallery-item"
        (click)="openLightbox(image)"
        [style.animation-delay.ms]="i * 100"
      >
        <div class="image-container">
          <img [src]="image.src" [alt]="image.alt" loading="lazy" />
          <div class="image-overlay">
            <div class="image-info">
              <h3>{{ image.title }}</h3>
            </div>
            <div class="expand-icon">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                <path
                  d="M15 3h6v6M14 10l6.1-6.1M9 21H3v-6M10 14l-6.1 6.1"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                />
              </svg>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Lightbox (unchanged) -->
  <div class="lightbox" *ngIf="selectedImage" (click)="closeLightbox()">
    <div class="lightbox-content" (click)="$event.stopPropagation()">
      <button class="close-btn" (click)="closeLightbox()">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <path
            d="M18 6L6 18M6 6L18 18"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          />
        </svg>
      </button>

      <img [src]="selectedImage.src" [alt]="selectedImage.alt" />

      <div class="lightbox-info">
        <h3>{{ selectedImage.title }}</h3>
      </div>

      <button class="nav-btn prev" (click)="previousImage()">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <path
            d="M15 18L9 12L15 6"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </button>

      <button class="nav-btn next" (click)="nextImage()">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <path
            d="M9 18L15 12L9 6"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </button>
    </div>
  </div>
</div>
